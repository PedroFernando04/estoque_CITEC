<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Item</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="sub"> 
        <div class="titulo">Editar Item</div>
    </div>

    <div class="containerCadastrar">

        <form th:action="@{/itens/{id}(id=${item.id})}" method="post" >

            <div class="formulario">
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" th:placeholder="${item.nome}">
            </div>

            <div class="formulario">
                <label for="categoria">Categoria: </label>
                <select name="categoria" id="categoria">
                    <option th:value="${item.categoriaItem}" th:text="${item.categoriaItem.descricao}">categoriaAtual</option>
                    <option th:each="categoria : ${categoriasExistentes}"
                            th:value="${categoria}"
                            th:text="${categoria.descricao}">
                    </option>
                </select>
            </div>

            <div class="formulario">
                <label for="rm">Código RM: </label>
                <input type="text" name="rm" id="rm" maxlength="7" oninput="this.value = this.value.replace(/[^0-9]/g, '')" th:placeholder="${item.codigoRM}">
            </div>

            <div class="formulario">
                <label for="patrimonio"> Patrimônio: </label>
                <input type="text" name="patrimonio" id="patrimonio" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '')" th:placeholder="${item.codigoPatrimonio}">
            </div>

             <div class="formulario">
                <button type="submit" id="update" name="update">Registrar</button>
            </div>

        </form>
    </div>
</body>
</html>
