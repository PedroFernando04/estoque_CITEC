<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Item</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="sub"> 
        <div class="titulo">Cadastro de Item</div>
    </div>

    <div class="containerCadastrar">

        <form th:action="@{/itens/cadastrar}" method="post" enctype="multipart/form-data">

            <div class="formulario">
                <label for="nomeFantasia">Nome Fantasia:</label>
                <input type="text" name="nomeFantasia" id="nomeFantasia" placeholder="  Nome Fantasia do item"  required>
            </div>

            <div class="formulario">
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" placeholder="  Nome do item">
            </div>

            <div class="formulario">
                <label for="rm">Código RM: </label>
                <input type="text" name="rm" id="rm" maxlength="9" pattern="\d{2}\.\d{2}\.\d{3}" placeholder="  00.00.000"  oninput="this.value = this.value.replace(/[^0-9]/g, '')"  required>
            </div>

            <div class="formulario">
                <label for="quantidade">Quantidade: </label>
                <input type="number" name="quantidade" id="quantidade" placeholder="  Quantidade estocada">
            </div>

            <div class="formulario">
                <input type="file" name="foto" id="foto" class="input-hidden" accept="image/*" onchange=mostrarPreViewFoto()>
                <label for="foto" class="custom-upload-label">
                    <span class="icon"></span>
                    <img src="" id="preview" alt="">
                    <strong>Escolha uma foto</strong>
                </label>
            </div>


             <div class="formulario">
                <button type="submit" id="botaoEnviar">Registrar</button>
            </div>

        </form>
    </div>

    <script>
    document.getElementById("rm").addEventListener("input", function(e) {
        let value = e.target.value.replace(/\D/g, "");

        if (value.length > 7) {
            value = value.slice(0, 7);
        }

        if (value.length > 4) {
            value = value.replace(/^(\d{2})(\d{2})(\d{0,3})$/, "$1.$2.$3");
        } else if (value.length > 2) {
            value = value.replace(/^(\d{2})(\d{0,2})$/, "$1.$2");
        }

        e.target.value = value;
    });


    function mostrarPreViewFoto() {
        // 1. Capturamos o input pelo ID
        const input = document.getElementById('foto');
        const preview = document.getElementById('preview');

        // 2. Verificamos se há um arquivo selecionado
        if (input.files && input.files[0]) {
            var reader = new FileReader();

            reader.onload = function(e) {
                // 3. Atribuímos o resultado da leitura ao src da imagem
                preview.src = e.target.result;
                preview.style.display = 'block';
                
                // Opcional: Esconde o ícone ou texto de "Escolha uma foto" para não sobrepor
                const labelText = document.querySelector('.custom-upload-label strong');
                if(labelText) labelText.style.display = 'none';
            }

            // 4. Lê o arquivo como uma URL de dados (Base64)
            reader.readAsDataURL(input.files[0]);
        }
    }
    </script>
</body>
</html>
