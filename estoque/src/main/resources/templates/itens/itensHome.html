<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <form th:action="@{/itens}" method="get" class="sub-head">

        <input name="nome" type="text" placeholder="  Pesquisar">

        <div class="filtros">

            <select name="estoqueId" >
                <option value="">Local</option>
                <option th:each="local : ${estoques}"
                        th:value="${local.id}"
                        th:text="${local.nome}">
                </option>
            </select>

            <select name="faltando">
                <option value="">Faltando</option>
                <option value="true">Sim</option>
                <option value="false">Não</option>
            </select>

            <button type="submit">
                Filtrar
            </button>

        </div>

    </form>
    

    <div class="sub">

        <div class="titulo">Itens</div> 

            <div class="cadastrar" >
                <a th:href="@{/itens/cadastrados}">
                    <button>Editar</button>
                </a>

                <a th:href="@{/itens/cadastrar}">
                    <button>Cadastrar +</button>
                </a>
            </div>

    </div>

    <div class="paginacao">
        <a th:if="${pagina.hasPrevious()}"
        th:href="@{/itens(page=${pagina.number - 1}, size=${pagina.size})}">
            ◀ Anterior
        </a>

        <span th:if="${pagina.hasPrevious() ||pagina.hasNext() }">
            Página <span th:text="${pagina.number + 1}"></span>
            de <span th:text="${pagina.totalPages}"></span>
        </span>

        <a th:if="${pagina.hasNext()}"
        th:href="@{/itens(page=${pagina.number + 1}, size=${pagina.size})}">
            Próxima ▶
        </a>
    </div>


    <div class="historico">
        <div>
            <table>
                
                <tr th:if="${!itemEstoque.empty}"
                    class="cabecalho-table">
                    <th>Item</th>
                    <th>Local</th>
                    <th>Quantidade</th>
                </tr>
                <tr th:if="${!itemEstoque.empty}"
                    class="conteudo-table"
                    th:each="i : ${itemEstoque}">

                    <th th:text="${i.item.nome}">item</th>
                    <th th:text="${i.estoque.nome}">local</th>
                    <th th:text="${i.quantidade}">quantidade</th>
                </tr>
            </table>
            <h3 th:if="${itemEstoque.empty}">Nenhum item associado a local ainda</h3>
        </div>

    </div>

</body>
</html>
