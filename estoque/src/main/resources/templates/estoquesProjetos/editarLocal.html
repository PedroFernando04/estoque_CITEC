<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Local</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
        <div class="titulo"><h2 th:text="${local.tipo == 'Projeto' ? 'Editar Projeto' : 'Editar Estoque'}">editar</h2></div>

            <form th:action="@{/local/{id}/editar(id=${local.id})}" method="post" id="update" name="update">

                <input type="hidden" id="tipoHidden" name="tipo">

                <div class="formulario">
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" th:placeholder="${local.nome}">
                </div>

                <div id="camposProjeto" th:if="${local.tipo == 'Projeto'}">
                    <div class="formulario">
                        <label for="solicitante">Solicitante:</label>
                        <input type="text" name="solicitante" id="solicitante" th:placeholder="${local.nomeSolicitante}">
                    </div>

                    <div class="formulario">
                        <label for="status">Status:</label>
                        <select name="status" id="status" >
                            <option th:value="${local.statusProjeto}" th:text="${local.statusProjeto.descricao}"></option>
                            <option 
                                th:each="status : ${statusExistentes}"
                                th:value="${status}"
                                th:text="${status.descricao}"
                                >
                            </option>
                        </select>
                    </div>

                    <div class="formulario">
                        <label for="funcionario">Responsável(is): </label>
                        <select multiple name="funcionario" id="funcionario" class="select-multiple">
                            <option th:each="funcionario : ${funcionariosExistentes}"
                                    th:value="${funcionario.id}"
                                    th:text="${funcionario.nome}">
                            </option>
                        </select>
                    </div>

                </div>
                
                <div class="formulario">
                    <button type="submit" id="update" name="update" >Registrar</button>
                </div>
        </form>
    </div>
    </main>
</body>
</html>
