<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Projeto</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
        <div class="titulo">
            Cadastro de Projeto

            <a th:href="@{/locais}">
                <button class="voltar">Voltar</button>
            </a>
        </div>

        <div class="containerCadastrar">

            <form th:action="@{/locais/cadastrar}" method="post" id="registrarForm" class="cadastrarLocal">

                <div class="formulario">
                    <label for="nome">Título:</label>
                    <input type="text" name="nome" id="nome" placeholder="  Título do Projeto" required>
                
                    <label for="solicitante">Solicitante:</label>
                    <input type="text" name="solicitante" id="solicitante" placeholder="  Nome do Solicitante" required>
                </div>

                <div class="formulario" style="flex-direction: column;  margin-top: 10px;">
                    <label for="descricao">Descrição: </label>
                    <textarea type="text" name="descricao" id="descricao"> </textarea>
                </div>

                <div class="formulario">
                    <label for="status">Status:</label>
                    <select name="status" id="status" required>
                        <option 
                            th:each="status : ${statusExistentes}"
                            th:value="${status}"
                            th:text="${status.descricao}">
                        </option>
                    </select>

                    <label for="categoria">Categoria:</label>
                    <select name="categoria" id="categoria" required>
                        <option
                            th:each="categoria : ${categoriasExistentes}" 
                            th:value="${categoria}"
                            th:text="${categoria.descricao}">
                        </option>
                    </select>
                </div>

                <div class="formulario" style="flex-direction: column; margin-top: 10px;">
                    <label for="funcionario">Responsável(is): </label>
                    <select multiple name="funcionario" id="funcionario" class="select-multiple" required>
                        <option th:each="funcionario : ${funcionariosExistentes}"
                                th:value="${funcionario.id}"
                                th:text="${funcionario.nome}">
                        </option>
                    </select>
                </div>

                <div class="formulario">
                    <button type="submit" id="botaoEnviar" >Registrar</button>
                </div>
        </form>
    </div>
    </main>

</body>
</html>
