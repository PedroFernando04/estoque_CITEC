<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="sub-head-detalhes">

        <div  class="titulo-detalhe">

            <h1 th:text="${local.nome}" >Nome Local</h1>
            
            <div class="label-detalhe" style="margin-left: 10px;">

                <div class="card-label-detalhe"
                    th:text="${local.categoria.descricao}"
                    th:classappend="${local.classeLabelCategoria}">
                    Categoria local
                </div>

                <div class="card-label-detalhe"
                    th:text="${local.statusProjeto.descricao}"
                    th:classappend="${local.classeLabelStatus}"
                    >
                    Status local
                </div>

            </div>
            

        </div>

        <div class="detalhes-detalhe" style="max-width: 550px;">
            <div class="solicitante-detalhe">
                <h2>Solicitante:  </h2>
                <h2 
                    th:text="${local.nomeSolicitante}"> nome solicitante
                </h2>
            </div>

            <div class="funcionarios-detalhe">
                <h2 th:text="${funcionariosLocal.size() > 1 ? 'Responsáveis:' : 'Responsável:' }">Responsáveis: </h2>
                <div class="funcionario-detalhe">
                    <table class="table-responsavel">
                        <th th:each="f : ${funcionariosLocal}" th:text="${f.funcionario.nome + ' (' + f.funcionario.cargo.descricao + ')' }">

                        </th>
                    </table>
                </div>
            </div>

            <div class="descricao">
                <h4 style="font-weight: bold;">
                    Descrição:
                </h4>
                <label class="label-detalhe"
                        th:text="${local.descricao}">
                    descricao
                </label>
            </div>

        </div>

    </div>

    <div id="botaoEditar">
        <button th:onclick="'window.location.href=\'/locais' + '\''" class="voltar">Voltar</button>
        
        <button th:onclick="'window.location.href=\'/local/' + ${local.id} + '/' + 'editar' + '\''" class="editar">Editar</button>
    </div>
    

    <form class="cadas"  method="post" id="remover" th:action="@{/local/{id}(id = ${local.id})}" style="display: none;" >
        <div class="popup" >
            <div style="margin-left: 80%; margin-top: -40px; margin-bottom: 20px;">
                <button style="background-color: #0069AD;" type="button" onclick="fecharModalDeletar()">&times;</button>
            </div>
            <h2>Como deseja remover este item?</h2>
            <input type="hidden" name="itemProjetoId" id="itemProjetoId">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <label for="quantidadeRemovida" class="">Quantidade: </label>
                <input type="number" name="quantidadeRemovida" id="quantidadeRemovida" placeholder="  Deixe vazio para o total">
            </div>
            <div>
                <button type="submit" name="estoque" id="estoque" style="background-color: #0069AD;">Devolver ao Estoque</button>
                <button type="submit" name="remove" id="remove" style="background-color: rgb(241, 33, 33);" >Excluir</button>
            </div>
        </div>
    </form>

    <div class="container-detalhe">

        <div class="item">
            <div class="titulo-item">
                <h3>Itens</h3>
                <button onclick="abrirModal()">Adicionar +</button>
            </div>


            <form th:action="@{/local/{id}(id=${local.id})}" method="post">

                <div class="modal" id="modal-adicionar">

                    <div class="modal-content">
                        <div class="cabecalho">
                            <h3>Item +</h3>
                            <button type="button" onclick="fecharModal()">&times;</button>
                        </div>
                        <div class="modal-content-input">
                            <div class="modal-content-input-content">
                                <h4>Item: </h4>
                                <input list="lista-item" name="itemNome" autocomplete="off" placeholder="  Digite ou Selecione">
                                <datalist id="lista-item">
                                    <option th:each="item : ${itensExistentes}"
                                            th:value="${item.nome.toString()}">
                                    </option>
                                </datalist>
                            </div>

                            <div class="modal-content-input-content">
                                <h4>Quantidade:</h4>
                                <input type="number" name="quantidade" id="quantidade" placeholder="  Digite a quantidade">
                            </div>
                            
                            <div class="modal-content-input-content">
                                <h4>Origem:</h4>
                                <input list="lista-locais" name="itemOrigem" placeholder="  Deixe em branco para utilizar o estoque">
                                <datalist id="lista-locais">
                                    <option th:each="local : ${locaisExistentes}"
                                            th:value="${local.nome.toString()}">
                                    </option>
                                </datalist>
                            </div>
                            

                            <div class="formulario">
                                <button type="submit" id="botaoEnviar" name="botaoEnviar">Registrar</button>
                            </div>
                        </div>
                        
                    </div>
                    
                </div>
            </form>

            
            <div class="painel-item">
                <table >
                    <tr class="cabecalho-table">
                        <th>Nome</th>
                        <th>Nome Fantasia</th>
                        <th>RM</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                    <tr th:if="${!itensLocal.empty}"
                        th:each="itemEstoque : ${itensLocal}">
                        <th th:text="${itemEstoque.item.nome}">nome</th>
                        <th th:text="${itemEstoque.item.nomeFantasia}">nomeFantasia</th>
                        <th th:text="${itemEstoque.item.codigoRMFormatado}">rm</th>
                        <th th:text="${itemEstoque.quantidade}">quantidade</th>
                        <th>
                            <button type="button" th:onclick="'abrirModalDeletar(' + ${itemEstoque.id} + ')'" style="background-color: rgb(241, 33, 33); color: white;">X</button>
                        </th>
                    </tr>
                </table>
                
                <h3 th:if="${itensLocal.empty}">Nenhum item associado!</h3>
            </div>
        </div>

        
    </div>

    <script>
        function abrirModal(){
            document.getElementById("modal-adicionar").style.display = "block";
        }

        function fecharModal(){
            document.getElementById("modal-adicionar").style.display = "none";
        }

        function abrirModalDeletar(id) {
                document.getElementById("itemProjetoId").value = id;
                document.getElementById("remover").style.display = "flex";
            }

        function fecharModalDeletar() {
            document.getElementById("remover").style.display = "none";
        }
    </script>
</body>
</html>
