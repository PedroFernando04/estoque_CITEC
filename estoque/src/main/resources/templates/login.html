<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="titulo">
        Login
    
        <a th:href="@{/funcionarios/cadastrar}">
            <button class="voltar">Cadastrar</button>
        </a>
    </div>

    <form th:action="@{/entrar}" method="post" class="containerCadastrar" style="margin-top: 30px;">

        <div class="cadastrarLocal">

            <div class="formulario">
                <label for="login">Login: </label>
                <input type="text" name="login" id="login">
            </div>

            <div class="formulario">
                <label for="senha">Senha: </label>
                <input type="text" name="senha" id="senha">
            </div>

            <div class="formulario">
                <button type="submit" id="botaoEnviar">Registrar</button>
            </div>
        </div>
        
    </form>
</body>
</html>
