<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar funcionário · Estoque CITEC</title>

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="pagina">
        <div class="cabecalho-pagina">
            <div>
                <h1>Editar funcionário</h1>
                <p class="subtitulo">Deixe em branco o que não quiser alterar.</p>
            </div>
            <button type="button" th:onclick="'window.location.href=\'/funcionarios' + '\''" class="btn voltar">Voltar</button>
        </div>

        <form th:action="@{/funcionarios/{id}(id=${funcionario.id})}" method="post" class="painel formulario-card">
            <div class="grade-campos">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" th:placeholder="${funcionario.nome}">
                </div>

                <div class="campo">
                    <label for="cargo">Cargo</label>
                    <select name="cargo" id="cargo">
                        <option th:value="${funcionario.cargo}" th:text="${funcionario.cargo.descricao}">cargoAtual</option>
                        <option th:each="cargo : ${cargosExistentes}"
                                th:value="${cargo}"
                                th:text="${cargo.descricao}">
                        </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="login">Login</label>
                    <input type="text" name="login" id="login" th:placeholder="${funcionario.login}">
                </div>

                <div class="campo">
                    <label for="senha">Nova senha</label>
                    <input type="password" name="senha" id="senha" autocomplete="new-password">
                </div>

            </div>

            <div class="rodape-form">
                <button type="button" th:onclick="'window.location.href=\'/funcionarios' + '\''" class="btn">Cancelar</button>
                <button type="submit" id="update" name="update" class="btn btn-primario">Registrar</button>
            </div>
        </form>
    </main>
</body>
</html>
