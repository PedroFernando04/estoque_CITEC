<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="sidebar">
    <a class="marca" th:href="@{/locais}">
        <img src="/imgs/Campus-PMM-2410Thumbnail_cesmac-1920w.png" alt="CESMAC">
        <span class="marca-legenda">Controle de estoque · CITEC</span>
    </a>

    <nav class="menu" sec:authorize="isAuthenticated()" aria-label="Principal">
        <a th:href="@{/locais}" data-rota="/locais,/local">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Projetos</span>
        </a>
        <a th:href="@{/pedidos}" data-rota="/pedidos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
            <span>Pedidos</span>
        </a>
        <a th:href="@{/itens}" data-rota="/itens">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 8-9-5-9 5v8l9 5 9-5z"/><path d="m3.3 7.5 8.7 5 8.7-5M12 22V12.5"/></svg>
            <span>Itens</span>
        </a>
        <a th:href="@{/historico}" data-rota="/historico">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
            <span>Histórico</span>
        </a>
        <a th:href="@{/funcionarios}" data-rota="/funcionarios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3a6.5 6.5 0 0 1 3 5.7"/></svg>
            <span>Funcionários</span>
        </a>

        <form th:action="@{/logout}" method="post">
            <button class="menu-sair" type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span>Sair</span>
            </button>
        </form>
    </nav>

    <script>
        (function () {
            var caminho = window.location.pathname;
            document.querySelectorAll('.menu a[data-rota]').forEach(function (a) {
                var rotas = a.getAttribute('data-rota').split(',');
                var ativo = rotas.some(function (r) {
                    return caminho === r || caminho.indexOf(r + '/') === 0;
                });
                if (ativo) { a.classList.add('ativo'); a.setAttribute('aria-current', 'page'); }
            });
        })();
    </script>
</header>
</body>
</html>
